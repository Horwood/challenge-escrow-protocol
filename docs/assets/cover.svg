    <text x="74" y="246" fill="#F4F7FA" font-size="68" font-weight="700" letter-spacing="-3">Protocol</text>
    <text x="74" y="290" fill="#B5C6D5" font-size="23">A thing has to end, even when the people deciding it disappear.</text>
  </g>
  <g>
