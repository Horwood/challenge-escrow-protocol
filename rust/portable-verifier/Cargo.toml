[package]
name = "portable-verifier"
version = "0.1.0"
edition = "2024"
description = "Independent conformance verifier for Challenge Escrow portable semantics"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
unicode-normalization = "0.1.24"
